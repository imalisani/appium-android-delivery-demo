name: Android Appium demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-tests/pom.xml

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Build the debug APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v6
        with:
          name: delivery-qa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Install Appium and Python dependencies
        run: |
          npm install --global appium@3.2.0
          appium driver install uiautomator2@6.7.0
          python -m pip install -r requirements.txt

      - name: Compile Java tests
        run: mvn -B -ntp -f java-tests/pom.xml test-compile

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Python and Java tests on Android 14
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: >-
            bash scripts/run-android-tests.sh all || {
            status=$?;
            adb logcat -d -v threadtime > artifacts/logcat.txt || true;
            exit "$status";
            }

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-appium-evidence
          path: artifacts/
          if-no-files-found: ignore

      - name: Upload Java execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-appium-java-evidence
          path: |
            java-tests/target/evidence/
            java-tests/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
